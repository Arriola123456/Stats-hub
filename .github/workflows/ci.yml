name: CI

on:
  push:
    branches: [ main, initial-development ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ruff
        run: pip install ruff
      - name: Lint basico (errores de sintaxis y nombres indefinidos)
        run: ruff check --select E9,F63,F7,F82 ai frontend
      - name: Parse (compileall)
        run: python -m compileall -q ai frontend
